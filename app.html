<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
        <div class="container-fluid p-8">
            <div class="card shadow w-100">
                <div class="card-header bg-primary text-white">
                 <h3 class="mb-0 fs-2">Employee Management</h3>
            </div>
                <div class="card-body">
                    <button class="btn btn-primary mb-4" onclick="showForm()">Add Employee</button>
               </div>
             <div id="employeeForm" class="card bg-light mt-4" style="display: none;">
                 <div class="card-body">
                    <h5 id="formTitle">Add Employee</h5>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter employee name">
                    </div>
                     <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter employee email">
                    </div>
                     <button id="saveButton" class="btn btn-success" onclick="saveEmployee()">Save</button>
                    <button class="btn btn-secondary" onclick="hideForm()">Cancel</button>
                </div>
            </div>
            <table class = "table table-bordered table-striped w-100">
                <thead class="table-dark">
            <tr>
                <th>No.</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
